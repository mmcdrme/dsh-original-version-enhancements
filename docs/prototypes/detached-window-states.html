<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>独立窗口状态原型</title>
<style>
:root{--desk:#0f1115;--win:#f9fafb;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Microsoft YaHei UI",system-ui,sans-serif;background:var(--desk);color:var(--ink);min-height:100vh}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#161a21;color:#cbd5e1;border-bottom:1px solid #232936;position:sticky;top:0;z-index:5}
.toolbar strong{color:#e2e8f0;font-weight:600;margin-right:6px}
.toolbar button{background:#1f2633;color:#cbd5e1;border:1px solid #2c3444;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.toolbar button.on{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
.desk{position:relative;min-height:calc(100vh - 52px);padding:48px;display:flex;gap:24px;flex-wrap:wrap}
.win{width:720px;max-width:100%;height:460px;background:var(--win);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;transition:opacity .15s ease,transform .15s ease}
.win.closing{opacity:0;transform:scale(.985)}
.win[hidden]{display:none}
.titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:#fff;font-size:12px;color:#374151;flex:0 0 auto}
.dot{width:8px;height:8px;border-radius:50%;background:#93c5fd}
.titlebar .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.body{flex:1;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.bar{width:200px;height:6px;border-radius:99px;background:#e5e7eb;overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:#9ca3af;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-60%)}100%{transform:translateX(260%)}}
.chat{width:100%;height:100%;padding:16px 20px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.msg{max-width:76%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.55}
.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#f1f5f9;border-bottom-left-radius:4px}
.composer{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#9ca3af;font-size:13px;background:#fff}
.toast{position:absolute;left:50%;top:20px;transform:translate(-50%,-10px);background:#111827;color:#e5e7eb;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.18s ease;max-width:560px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .t{font-size:13px}
.toast .s{font-size:12px;color:#9ca3af;margin-top:2px}
.toast .acts{display:flex;gap:8px;margin-top:8px}
.toast button{border:0;border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.toast .primary{background:#2563eb;color:#fff}
.toast .ghost{background:#1f2937;color:#e5e7eb}
</style>
</head>
<body>
<header class="toolbar">
  <strong>独立窗口状态原型</strong>
  <button data-state="opening" class="on">载入中</button>
  <button data-state="ready">就绪</button>
  <button data-state="failed">失败（toast）</button>
  <button data-state="closing">关闭中</button>
  <label>不透明度 <input id="opacity" type="range" min="30" max="100" value="100"><span id="opacityVal">100%</span></label>
  <label><input id="mute" type="checkbox" checked> 静音</label>
  <label><input id="multi" type="checkbox"> 第二个窗口</label>
</header>
<main class="desk" id="desk">
  <section class="win" id="win">
    <div class="titlebar"><span class="dot"></span><span class="name">工作区 / 会话名 #a1b2</span><span class="chip" id="chip">载入中</span><span>— □ ×</span></div>
    <div class="body" id="body"></div>
  </section>
  <section class="win" id="win2" hidden>
    <div class="titlebar"><span class="dot"></span><span class="name">工作区 / 另一个会话 #c3d4</span><span class="chip">就绪</span><span>— □ ×</span></div>
    <div class="body" id="body2"></div>
  </section>
  <div class="toast" id="toast" role="status">
    <div>
      <div class="t">窗口没有打开</div>
      <div class="s">就绪超时（45s）。日志：%LOCALAPPDATA%\dsh-ove-window\startup-error.log</div>
      <div class="acts"><button class="primary">重试</button><button class="ghost">改用页内窗口</button><button class="ghost">查看日志</button></div>
    </div>
  </div>
</main>
<script>
var body = document.getElementById('body');
var body2 = document.getElementById('body2');
var chip = document.getElementById('chip');
var win = document.getElementById('win');
var toast = document.getElementById('toast');
var loading = '<div class="loading"><div>正在载入会话…</div><div class="bar"><i></i></div></div>';
var chat = '<div class="chat"><div class="msg me">把这轮改成两段超时预算</div><div class="msg ai">明白：浏览器启动 30s，就绪 45s，超时即关闭并回收。</div><div class="composer">继续输入…</div></div>';
function render(state){
  win.hidden = state === 'failed';
  win.classList.toggle('closing', state === 'closing');
  chip.textContent = state === 'opening' ? '载入中' : state === 'ready' ? '就绪' : state === 'closing' ? '关闭中' : '已关闭';
  body.innerHTML = state === 'ready' ? chat : loading;
  toast.classList.toggle('show', state === 'failed');
  var list = document.querySelectorAll('[data-state]');
  for (var i = 0; i < list.length; i++) list[i].classList.toggle('on', list[i].dataset.state === state);
}
var buttons = document.querySelectorAll('[data-state]');
for (var i = 0; i < buttons.length; i++) buttons[i].addEventListener('click', function(){ render(this.dataset.state); });
document.getElementById('opacity').addEventListener('input', function(e){
  var v = e.target.value; document.getElementById('opacityVal').textContent = v + '%';
  win.style.opacity = v / 100;
});
document.getElementById('multi').addEventListener('change', function(e){
  document.getElementById('win2').hidden = !e.target.checked;
  body2.innerHTML = chat;
});
body2.innerHTML = chat;
render('opening');
</script>
</body>
</html>
